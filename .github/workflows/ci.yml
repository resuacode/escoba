# Tests automáticos (EditMode + PlayMode) en cada push y pull request.
# Requiere los secrets UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD (ver docs/CI.md).
name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Tests (EditMode + PlayMode)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Caché de Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-tests-

      - name: Ejecutar tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados de tests
          artifactsPath: test-results

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
